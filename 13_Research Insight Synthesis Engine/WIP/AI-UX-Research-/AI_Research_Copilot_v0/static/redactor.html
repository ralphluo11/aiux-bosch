<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>离线个人信息脱敏</title>
    <link rel="stylesheet" href="/redactor.css" />
    <script src="/redactor.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">LOCAL PRIVACY UTILITY · POC</p>
          <h1>离线个人信息脱敏</h1>
          <p class="subtitle">文件只在当前浏览器内存中读取和处理，不发送到后端或任何外部服务。</p>
        </div>
        <a href="/#/sources">返回 Research Workspace</a>
      </header>

      <section class="privacy-banner" aria-label="隐私说明">
        <strong>离线处理</strong>
        <span>此页面不使用 <code>fetch</code>、XHR、WebSocket、模型或分析服务。</span>
      </section>

      <div class="layout">
        <section class="panel setup">
          <h2>1. 选择文件</h2>
          <label id="drop-zone" class="drop-zone">
            <input id="file-input" type="file" multiple accept=".txt,.md,.csv,.json,.srt,.vtt,.docx,text/plain,text/markdown,text/csv,application/json,application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
            <span class="drop-title">拖入文件，或点击选择</span>
            <span>支持 DOCX、TXT、MD、CSV、JSON、SRT、VTT</span>
          </label>
          <div id="file-list" class="file-list"><p class="muted">尚未选择文件</p></div>

          <h2>2. 补充漏检信息（可选）</h2>
          <label>
            已知姓名（自动识别之外的补充）
            <textarea id="names" rows="4" placeholder="每行一个，例如：&#10;张三&#10;李小明"></textarea>
          </label>
          <label>
            自定义词条
            <textarea id="terms" rows="4" placeholder="每行使用 类型=原文，例如：&#10;公司=示例科技有限公司&#10;项目=北极星项目"></textarea>
          </label>
          <button id="redact" type="button" disabled>识别敏感信息</button>
          <p id="error" class="error" role="alert" hidden></p>
        </section>

        <section class="panel results">
          <div class="result-head">
            <div><p class="eyebrow">RESULT</p><h2>3. 检查并下载</h2></div>
            <button id="download-all" class="secondary" type="button" disabled>全部下载</button>
          </div>
          <div id="summary" class="summary empty">识别后将在这里列出候选信息，确认前不会修改文件。</div>
          <div id="candidate-review" hidden>
            <div class="review-actions">
              <strong>识别候选</strong>
              <span><button id="select-all" class="text-button" type="button">全选</button><button id="select-none" class="text-button" type="button">全不选</button></span>
            </div>
            <div id="candidate-list" class="candidate-list"></div>
            <button id="confirm-redact" type="button">确认所选项并脱敏</button>
          </div>
          <div id="result-list" class="result-list"></div>
          <p class="review-note">规则识别可能漏掉无标签姓名、昵称、口语化地址，以及被 Word 拆分到多个格式片段中的信息。下载后请人工复核，再导入 Research Agent。</p>
        </section>
      </div>
    </main>
  </body>
</html>
